  # Frontend (React + Vite)
  # ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - emedicare-network

  # ──────────────────────────
  # API Gateway  :8080
