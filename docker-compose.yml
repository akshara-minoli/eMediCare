version: '3.9'

services:
  # ──────────────────────────
  # Frontend (React + Vite)
  # ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - emedicare-network

  # ──────────────────────────
  # API Gateway  :8080
  # ──────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../docker/api-gateway.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:5001
      - APPOINTMENT_SERVICE_URL=http://appointment-service:5002
      - PAYMENT_SERVICE_URL=http://payment-service:5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
      - AI_SERVICE_URL=http://ai-service:5005
      - DOCTOR_SERVICE_URL=http://doctor-service:5006
      - PATIENT_SERVICE_URL=http://patient-service:5007
      - TELEMEDICINE_SERVICE_URL=http://telemedicine-service:5008
      - ADMIN_SERVICE_URL=http://admin-service:5009
    depends_on:
      - auth-service
      - appointment-service
      - payment-service
      - notification-service
      - ai-service
      - doctor-service
      - patient-service
      - telemedicine-service
      - admin-service
    networks:
      - emedicare-network

  # ──────────────────────────
  # Auth Service  :5001
  # ──────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/emedicare_auth
      - JWT_SECRET=change_this_secret_in_production
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Appointment Service  :5002
  # ──────────────────────────
  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/emedicare_appointments
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Payment Service  :5003
  # ──────────────────────────
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/emedicare_payments
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Notification Service  :5004
  # ──────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
    networks:
      - emedicare-network

  # ──────────────────────────
  # AI Service  :5005
  # ──────────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
    networks:
      - emedicare-network

  # ──────────────────────────
  # Doctor Service  :5006
  # ──────────────────────────
  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://mongo:27017/emedicare_doctors
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Patient Service  :5007
  # ──────────────────────────
  patient-service:
    build:
      context: ./services/patient-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGO_URI=mongodb://mongo:27017/emedicare_patients
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Telemedicine Service  :5008
  # ──────────────────────────
  telemedicine-service:
    build:
      context: ./services/telemedicine-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - MONGO_URI=mongodb://mongo:27017/emedicare_telemedicine
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # Admin Service  :5009
  # ──────────────────────────
  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: ../../docker/services.Dockerfile
    ports:
      - "5009:5009"
    environment:
      - PORT=5009
      - MONGO_URI=mongodb://mongo:27017/emedicare_admin
    depends_on:
      - mongo
    networks:
      - emedicare-network

  # ──────────────────────────
  # MongoDB
  # ──────────────────────────
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - emedicare-network

networks:
  emedicare-network:
    driver: bridge

volumes:
  mongodata:
