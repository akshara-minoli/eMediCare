apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: emedicare
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: emedicare/ai-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5005
          name: http
        env:
        - name: PORT
          value: "5005"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: emedicare
  labels:
    app: ai-service
spec:
  type: ClusterIP
  ports:
  - port: 5005
    targetPort: 5005
    protocol: TCP
    name: http
  selector:
    app: ai-service
