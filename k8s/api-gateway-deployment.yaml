# ── API Gateway Deployment ─────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: emedicare/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: APPOINTMENT_SERVICE_URL
              value: "http://appointment-service:5002"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:5003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:5004"
            - name: AI_SERVICE_URL
              value: "http://ai-service:5005"
            - name: DOCTOR_SERVICE_URL
              value: "http://doctor-service:5006"
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service:5007"
            - name: TELEMEDICINE_SERVICE_URL
              value: "http://telemedicine-service:5008"
            - name: ADMIN_SERVICE_URL
              value: "http://admin-service:5009"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
