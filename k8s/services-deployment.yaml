apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: emedicare
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: emedicare
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: emedicare/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: emedicare-secrets
              key: MONGO_URI_AUTH
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: emedicare-secrets
              key: JWT_SECRET
---
