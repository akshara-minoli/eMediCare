apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: emedicare
  labels:
    app: telemedicine-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
      - name: telemedicine-service
        image: emedicare/telemedicine-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5008
          name: http
        env:
        - name: PORT
          value: "5008"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: emedicare-secrets
              key: MONGO_URI_TELEMEDICINE
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: emedicare
  labels:
    app: telemedicine-service
spec:
  type: ClusterIP
  ports:
  - port: 5008
    targetPort: 5008
    protocol: TCP
    name: http
  selector:
    app: telemedicine-service
